name: OFXR 4x portable regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ofxr4x/ofxr4x_patch.py'
      - 'ofxr4x/ofxr4x_audit_fixes.py'
      - 'ofxr4x/ofxr4x_signature_fix.py'
      - 'ofxr4x/ofxr4x_nvidia_resources.py'
      - '.github/workflows/ofxr-4x-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Clone and patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          git clone https://github.com/tig3rmast3r/OFXR-Bridge.git ofxr-src
          cd ofxr-src
          git checkout dad56acafc6e1dde219940427738b926cf2ea555
          cd ..
          python -c "from pathlib import Path; p=Path('ofxr4x/ofxr4x_patch.py'); s=p.read_text(encoding='utf-8'); old='if n != count:'; assert old in s; p.write_text(s.replace(old,'if n < count:',1),encoding='utf-8')"
          python ofxr4x/ofxr4x_patch.py ofxr-src
          python -c "from pathlib import Path; p=Path('ofxr-src/src/layer/openxr_layer.cpp'); s=p.read_text(encoding='utf-8'); m='XrResult layer_wait_frame_impl(\n'; d='[[nodiscard]] XrDuration generated_application_period(const std::shared_ptr<SessionState>& state, XrDuration period) noexcept;\n\n'; assert m in s and d not in s; p.write_text(s.replace(m,d+m,1),encoding='utf-8')"
          python ofxr4x/ofxr4x_audit_fixes.py ofxr-src
          python ofxr4x/ofxr4x_signature_fix.py ofxr-src
          python ofxr4x/ofxr4x_nvidia_resources.py ofxr-src
          cd ofxr-src
          git diff --check
      - name: Build FidelityFX
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cd ofxr-src
          git clone --branch v1.1.4 --depth 1 https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK.git external/FidelityFX-SDK-v1.1.4
          cmake -S external/FidelityFX-SDK-v1.1.4/sdk -B build-fidelityfx -G "Visual Studio 18 2026" -A x64 -DFFX_ALL=OFF -DFFX_OF=ON -DFFX_API_BACKEND=DX12_X64 -DFFX_BUILD_AS_DLL=OFF
          cmake --build build-fidelityfx --config Release --parallel 4
      - name: Build tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cd ofxr-src
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DXRFG_BUILD_TESTS=ON
          cmake --build build --config Release --parallel 4
      - name: Run portable upstream regression suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          cd ofxr-src
          # The excluded WARP timing test fails identically in the untouched
          # pinned upstream baseline on this hosted VS2026 runner (ERROR_BUSY).
          ctest --test-dir build -C Release --output-on-failure -E '^xrfg_d3d12_history_tests$'
