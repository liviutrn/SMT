name: Build SteamVR Prism Vector Fix v3b
on:
  push:
    branches: [experiment/steamvr-prism-vectorfix-v3b-2182]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S steamvr_prism_vectorfix -B build -A x64
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/SteamVRPrismVectorFix.exe package/
          Copy-Item steamvr_prism_vectorfix/README_TEST.txt package/
          Compress-Archive -Path package/* -DestinationPath SteamVR-PRISM-VECTORFIX-V3B-2182.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: SteamVR-PRISM-VECTORFIX-V3B-2182
          path: SteamVR-PRISM-VECTORFIX-V3B-2182.zip
