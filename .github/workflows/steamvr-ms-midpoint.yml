name: Build SteamVR midpoint-only Motion Smoothing hook

on:
  push:
    branches:
      - experiment/steamvr-ms-midpoint-only-2182
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned MinHook
        shell: pwsh
        run: |
          git clone https://github.com/TsudaKageyu/minhook.git minhook
          Set-Location minhook
          git checkout v1.3.4

      - name: Configure
        shell: pwsh
        run: |
          cmake -S steamvr_ms_midpoint -B build -A x64 -DMINHOOK_ROOT="$pwd/minhook"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/SteamVRMSMidpoint.exe package/
          Copy-Item build/Release/SteamVRMSMidpointHook.dll package/
          Copy-Item steamvr_ms_midpoint/README_TEST.txt package/
          Compress-Archive -Path package/* -DestinationPath SteamVR-MS-MIDPOINT-ONLY-2182.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: SteamVR-MS-MIDPOINT-ONLY-2182
          path: SteamVR-MS-MIDPOINT-ONLY-2182.zip
