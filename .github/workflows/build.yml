name: Build SMT analog clutch

on:
  workflow_dispatch:
  push:
    branches: [ analog-clutch ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Apply analog clutch prototype
        shell: pwsh
        run: |
          $files = @{
            'DLL\config.cpp' = ''
            'DLL\input.h' = ''
            'DLL\input.cpp' = ''
            'DLL\game_data.h' = ''
            'DLL\game_data.cpp' = ''
            'DLL\gui.cpp' = ''
            'DLL\DLL.vcxproj' = ''
          }
          foreach ($entry in $files.GetEnumerator()) {
            [IO.File]::WriteAllBytes($entry.Key, [Convert]::FromBase64String($entry.Value))
          }
      - name: Build Release x64
        run: msbuild "SnowRunner Manual Transmission.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
      - name: Collect plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Recurse -Filter SMT.asi | Select-Object -First 1
          if (-not $plugin) { throw "SMT.asi was not produced" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item $plugin.FullName artifact\SMT.asi
      - uses: actions/upload-artifact@v4
        with:
          name: SMT-v7-early-bite-pedal-idle
          path: artifact/*
