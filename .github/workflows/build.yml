name: Build SMT analog clutch

on:
  workflow_dispatch:
  push:
    branches: [analog-clutch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore DLL/config.cpp
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/config.cpp',[Convert]::FromBase64String(''))
      - name: Restore DLL/input.h
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/input.h',[Convert]::FromBase64String(''))
      - name: Restore DLL/input.cpp
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/input.cpp',[Convert]::FromBase64String(''))
      - name: Restore DLL/game_data.h
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/game_data.h',[Convert]::FromBase64String(''))
      - name: Restore DLL/game_data.cpp
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/game_data.cpp',[Convert]::FromBase64String(''))
      - name: Restore DLL/gui.cpp
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/gui.cpp',[Convert]::FromBase64String(''))
      - name: Restore DLL/DLL.vcxproj
        shell: powershell
        run: |
          [IO.File]::WriteAllBytes('DLL/DLL.vcxproj',[Convert]::FromBase64String(''))
      - name: Build
        shell: powershell
        run: msbuild "SnowRunner Manual Transmission.sln" /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143
      - name: Upload SMT
        uses: actions/upload-artifact@v4
        with:
          name: SMT-v9-gear4-powercoef-test
          path: |
            x64/Release/SMT.asi
            x64/Release/SMT.pdb
