name: Build SteamVRHalfRate SKSEVR experiment

on:
  push:
    branches:
      - experiment/skyrimvr-interleaved60
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - name: Clone pinned OpenVR headers
        shell: pwsh
        run: |
          git clone https://github.com/ValveSoftware/openvr.git openvr
          Set-Location openvr
          git checkout 0924064316de3effbcd1acf1e309182a2deb1c05

      - name: Configure
        shell: pwsh
        run: |
          cmake -S steamvr_half_rate -B build -A x64 -DOPENVR_HEADERS="$pwd/openvr/headers"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/Data/SKSE/Plugins | Out-Null
          Copy-Item build/Release/SteamVRHalfRate.dll package/Data/SKSE/Plugins/
          Copy-Item steamvr_half_rate/README_TEST.txt package/
          Compress-Archive -Path package/* -DestinationPath SteamVRHalfRate-SKSEVR-EXPERIMENT.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: SteamVRHalfRate-SKSEVR-EXPERIMENT
          path: SteamVRHalfRate-SKSEVR-EXPERIMENT.zip
