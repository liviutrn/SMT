name: OFXR DLSSG POC v0.3 Windows build

on:
  push:
    branches:
      - ofxr-dlssg-build-v03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify audited POC package
        shell: pwsh
        run: |
          $parts = 1..3 | ForEach-Object { Get-Content -Raw "ofxr-dlssg-build-v03/poc.b64.$_" }
          $b64 = ($parts -join '').Trim()
          $zip = Join-Path $env:RUNNER_TEMP 'OFXR_DLSSG_POC_v0.3.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '444bf75bb4bfa43900ac5797ee7c8c7862393514c8146474a66ea2519375de44'
          Write-Host "POC baseline SHA256: $hash"
          if ($hash -ne $expected) { throw "POC package hash mismatch: expected $expected, got $hash" }
          $pkg = Join-Path $env:RUNNER_TEMP 'poc'
          Expand-Archive -Path $zip -DestinationPath $pkg -Force
          $root = Join-Path $pkg 'OFXR_DLSSG_POC_v0.3'
          $cpp = Join-Path $root 'files/src/d3d12/dlssg_poc.cpp'

          # Apply the two findings from the final static/first-compiler audit
          # using Python so the exact LF/UTF-8 bytes are deterministic.
          $env:OFXR_DLSSG_CPP = $cpp
          @'
          from pathlib import Path
          import os
          p = Path(os.environ['OFXR_DLSSG_CPP'])
          s = p.read_text(encoding='utf-8')
          if s.count('copy_srv.BaseShaderRegister = 1;') != 1:
              raise SystemExit('expected pre-hotfix t1 root binding not found')
          s = s.replace('// Copy root: generated frame SRV at t1.',
                        '// Copy root: generated frame SRV at t2 (matches dlssg_poc.hlsl).')
          s = s.replace('copy_srv.BaseShaderRegister = 1;',
                        'copy_srv.BaseShaderRegister = 2;')
          old = '''    } __except(EXCEPTION_EXECUTE_HANDLER) {\n        if (exception_code != nullptr) *exception_code = GetExceptionCode();\n        return NVSDK_NGX_Result_FAIL_PlatformError;\n    }'''
          new = '''    } __except(\n        (exception_code != nullptr ? (*exception_code = GetExceptionCode()) : 0,\n         EXCEPTION_EXECUTE_HANDLER)) {\n        return NVSDK_NGX_Result_FAIL_PlatformError;\n    }'''
          if s.count(old) != 2:
              raise SystemExit(f'expected two pre-hotfix SEH handlers, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8', newline='\n')
          '@ | py -
          if ($LASTEXITCODE -ne 0) { throw 'v0.3 final source hotfix failed' }

          $cppHash = (Get-FileHash $cpp -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedCpp = '891c00081ecfa892038d08d3bb4435af6fbefe132a778a523f26f5fcdc1dc19f'
          Write-Host "Final dlssg_poc.cpp SHA256: $cppHash"
          if ($cppHash -ne $expectedCpp) { throw "Corrected dlssg_poc.cpp hash mismatch: expected $expectedCpp, got $cppHash" }
          Add-Content -Path (Join-Path $root 'AUDIT.md') -Value "`n### Final pre-build corrections`nThe Windows build maps GeneratedFrame to t2 and evaluates GetExceptionCode() in the MSVC __except filter. Final helper SHA-256: $cppHash.`n"
          py -m py_compile (Join-Path $root 'apply_dlssg_poc.py')
          if ($LASTEXITCODE -ne 0) { throw "POC patcher Python syntax check failed" }

      - name: Clone exact OFXR base
        shell: pwsh
        run: |
          git clone https://github.com/tig3rmast3r/OFXR-Bridge.git ofxr
          git -C ofxr checkout dad56acafc6e1dde219940427738b926cf2ea555
          $head = (git -C ofxr rev-parse HEAD).Trim()
          if ($head -ne 'dad56acafc6e1dde219940427738b926cf2ea555') { throw "Unexpected OFXR HEAD $head" }

      - name: Apply DLSS-G VR POC v0.3 patch
        shell: pwsh
        run: |
          $patcher = Join-Path $env:RUNNER_TEMP 'poc/OFXR_DLSSG_POC_v0.3/apply_dlssg_poc.py'
          py $patcher (Resolve-Path 'ofxr').Path
          if ($LASTEXITCODE -ne 0) { throw "POC patcher failed" }
          git -C ofxr diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patched source failed git diff --check" }
          git -C ofxr diff --stat

      - name: Build Release x64
        shell: pwsh
        run: |
          $builder = Join-Path $env:RUNNER_TEMP 'poc/OFXR_DLSSG_POC_v0.3/build_poc.ps1'
          & $builder -Source (Resolve-Path 'ofxr').Path -Build 'build-dlssg-poc'
          if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }

      - name: Run portable regression tests
        shell: pwsh
        run: |
          $release = Join-Path (Resolve-Path 'ofxr').Path 'build-dlssg-poc/Release'
          $tests = @(
            'xrfg_core_tests.exe',
            'xrfg_optical_flow_tests.exe',
            'xrfg_fps_overlay_tests.exe',
            'xrfg_bridge_flight_logger_tests.exe'
          )
          foreach ($test in $tests) {
            $path = Join-Path $release $test
            if (!(Test-Path $path)) { throw "Missing regression test binary: $path" }
            Write-Host "Running $test"
            & $path
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }

      - name: Package compiled prototype
        shell: pwsh
        run: |
          $release = Join-Path (Resolve-Path 'ofxr').Path 'build-dlssg-poc/Release'
          $required = @(
            (Join-Path $release 'OFXRBridgeTray.exe'),
            (Join-Path $release 'ofxr/XR_APILAYER_XRFrameBridge_diagnostic.dll'),
            (Join-Path $release 'ofxr/ofxr_bridge.ini'),
            (Join-Path $release 'ofxr/nvngx_dlssg.dll')
          )
          foreach ($f in $required) {
            if (!(Test-Path $f)) { throw "Missing build output: $f" }
            Get-Item $f | Format-List FullName,Length,LastWriteTime
          }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist-v03'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Join-Path $release 'OFXRBridgeTray.exe') $dist
          Copy-Item (Join-Path $release 'ofxr') $dist -Recurse
          Copy-Item (Join-Path $env:RUNNER_TEMP 'poc/OFXR_DLSSG_POC_v0.3/README.md') $dist
          Copy-Item (Join-Path $env:RUNNER_TEMP 'poc/OFXR_DLSSG_POC_v0.3/AUDIT.md') $dist
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath 'OFXR_DLSSG_POC_v0.3_COMPILED.zip' -Force
          Get-FileHash 'OFXR_DLSSG_POC_v0.3_COMPILED.zip' -Algorithm SHA256

      - name: Upload compiled prototype
        uses: actions/upload-artifact@v4
        with:
          name: OFXR_DLSSG_POC_v0.3_COMPILED
          path: OFXR_DLSSG_POC_v0.3_COMPILED.zip
          if-no-files-found: error
          retention-days: 7
